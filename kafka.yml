---
- name: Download and Unpack Apache Kafka
  hosts: localhost
  become: yes
  vars:
    kafka_version: "3.7.0"
    kafka_scala_version: "2.13"
    download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    archive_path: "/tmp/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    extract_dir: "/opt/kafka"

  tasks:
    - name: Download Kafka archive
      ansible.builtin.get_url:
        url: "{{ download_url }}"
        dest: "{{ archive_path }}"
        mode: '0644'

    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ extract_dir }}"
        state: directory
        mode: '0755'

    - name: Unarchive Kafka
      ansible.builtin.unarchive:
        src: "{{ archive_path }}"
        dest: "{{ extract_dir }}"
        remote_src: yes
